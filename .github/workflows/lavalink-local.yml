name: Local Lavalink

on:
  workflow_dispatch:
    inputs:
      action:
        description: Install, diagnose, inspect, or roll back the isolated Lavalink stack
        required: true
        default: status
        type: choice
        options:
          - status
          - diagnostics
          - install
          - rollback

concurrency:
  group: lavalink-local
  cancel-in-progress: false

jobs:
  infrastructure:
    name: Lavalink infrastructure
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      HYSTERIA_AUTH: ${{ secrets.HYSTERIA_AUTH }}
      LAVALINK_LOCAL_PASSWORD: ${{ secrets.LAVALINK_LOCAL_PASSWORD }}
    steps:
      - name: Apply on the local bot server
        uses: appleboy/ssh-action@v1.0.3
        env:
          HYSTERIA_AUTH: ${{ env.HYSTERIA_AUTH }}
          LAVALINK_LOCAL_PASSWORD: ${{ env.LAVALINK_LOCAL_PASSWORD }}
          HYSTERIA_SERVER: vpn.televibe.host
          HYSTERIA_PORT: "18443"
          HYSTERIA_SNI: vpn.televibe.host
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_ROOT_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          envs: HYSTERIA_AUTH,LAVALINK_LOCAL_PASSWORD,HYSTERIA_SERVER,HYSTERIA_PORT,HYSTERIA_SNI
          script: |
            set -e
            cd /opt/slaybot
            if [ "${{ inputs.action }}" = "diagnostics" ]; then
              bash ops/lavalink/install.sh status
              echo "=== Lavalink journal ==="
              journalctl -u lavalink.service --since "30 minutes ago" --no-pager |
                tail -n 250 || true
              echo "=== Lavalink file log ==="
              tail -n 300 /opt/lavalink/logs/*.log 2>/dev/null || true
              echo "=== Hysteria journal ==="
              journalctl -u hysteria-lavalink.service --since "30 minutes ago" --no-pager |
                tail -n 120 || true
              echo "=== Routing counters ==="
              iptables -t mangle -L LAVALINK_MARK -n -v || true
              iptables -t mangle -L LAVALINK_TPROXY -n -v || true
              echo "=== Bot music log ==="
              grep -hE "Music voice|Track(Start|End|Exception|Stuck)|Lavalink|local-lavalink" \
                logs/combined-*.log 2>/dev/null | tail -n 200 || true
            else
              bash ops/lavalink/install.sh "${{ inputs.action }}"
            fi

  reconnect-bot:
    name: Reconnect SLAYBOT
    if: ${{ inputs.action == 'install' }}
    needs: infrastructure
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      LAVALINK_LOCAL_PASSWORD: ${{ secrets.LAVALINK_LOCAL_PASSWORD }}
    steps:
      - name: Reload and verify the bot
        uses: appleboy/ssh-action@v1.0.3
        env:
          LAVALINK_LOCAL_PASSWORD: ${{ env.LAVALINK_LOCAL_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: LAVALINK_LOCAL_PASSWORD
          script: |
            set -e
            cd /opt/slaybot
            pm2 reload slaybot --update-env
            sleep 12
            pm2 describe slaybot | grep -E "status.*online"
            curl -fsS --max-time 5 \
              -H "Authorization: $LAVALINK_LOCAL_PASSWORD" \
              http://127.0.0.1:2333/version
            for _ in $(seq 1 10); do
              if connection_log="$(
                grep -hF 'Node \"local-lavalink\" connected' logs/combined-*.log 2>/dev/null
              )"; then
                printf '%s\n' "$connection_log" | tail -1
                exit 0
              fi
              sleep 2
            done
            echo "No local Lavalink connection was recorded" >&2
            grep -hE 'local-lavalink|Lavalink|Node "' logs/combined-*.log 2>/dev/null |
              tail -n 20 >&2 || true
            exit 1
