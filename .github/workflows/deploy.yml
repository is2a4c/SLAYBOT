name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-ci:
    name: ✅ Check CI Status
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI Passed
        run: echo "✅ CI passed, proceeding with deployment"

  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: check-ci
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.check-ci.result == 'success') }}
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Create .env file
        run: |
          cat > .env << EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          MONGO_CONNECTION=${{ secrets.MONGO_CONNECTION }}
          ERROR_LOGS=${{ secrets.ERROR_LOGS }}
          JOIN_LEAVE_LOGS=${{ secrets.JOIN_LEAVE_LOGS }}
          BOT_SECRET=${{ secrets.BOT_SECRET }}
          SESSION_PASSWORD=${{ secrets.SESSION_PASSWORD }}
          WEATHERSTACK_KEY=${{ secrets.WEATHERSTACK_KEY }}
          STRANGE_API_KEY=${{ secrets.STRANGE_API_KEY }}
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          EOF

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH || '/opt/slaybot' }}

            CONFIG_BACKUP="$(mktemp)"
            if [ -f config.js ]; then
              cp config.js "$CONFIG_BACKUP"
            fi

            # Sync latest code. This overwrites tracked local edits such as config.js,
            # then restores server-local config.js below.
            git fetch origin main
            git reset --hard origin/main

            if [ -s "$CONFIG_BACKUP" ]; then
              cp "$CONFIG_BACKUP" config.js
            elif [ ! -f config.js ]; then
              echo "Missing server config.js. Copy example.config.js to config.js and configure it on the server."
              exit 1
            fi
            rm -f "$CONFIG_BACKUP"

            # Install dependencies
            npm ci --omit=dev

            # Restart bot
            pm2 reload slaybot --update-env 2>/dev/null || pm2 start bot.js --name slaybot

            # Show status
            pm2 status

      - name: Health Check
        run: |
          echo "Waiting for bot to start..."
          sleep 10
          echo "✅ Deployment complete!"
