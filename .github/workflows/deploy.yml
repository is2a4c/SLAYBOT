name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-ci:
    name: ✅ Check CI Status
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI Passed
        run: echo "✅ CI passed, proceeding with deployment"

  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: check-ci
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.check-ci.result == 'success') }}
    environment:
      name: production
    env:
      SERVER_ROOT_PASSWORD: ${{ secrets.SERVER_ROOT_PASSWORD }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      MONGO_CONNECTION: ${{ secrets.MONGO_CONNECTION }}
      ERROR_LOGS: ${{ secrets.ERROR_LOGS }}
      JOIN_LEAVE_LOGS: ${{ secrets.JOIN_LEAVE_LOGS }}
      BOT_SECRET: ${{ secrets.BOT_SECRET }}
      SESSION_PASSWORD: ${{ secrets.SESSION_PASSWORD }}
      WEATHERSTACK_KEY: ${{ secrets.WEATHERSTACK_KEY }}
      STRANGE_API_KEY: ${{ secrets.STRANGE_API_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      LAVALINK_LOCAL_PASSWORD: ${{ secrets.LAVALINK_LOCAL_PASSWORD }}
      IMAGE_SPAM_E2E_IMAGE: ${{ secrets.IMAGE_SPAM_E2E_IMAGE }}
      SMART_INVITES_ENABLED: ${{ vars.SMART_INVITES_ENABLED }}
      SMART_INVITES_BASE_URL: ${{ vars.SMART_INVITES_BASE_URL }}
      SMART_INVITES_OFFICIAL_GUILD_ID: ${{ vars.SMART_INVITES_OFFICIAL_GUILD_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Stop stale root bot
        if: ${{ env.SERVER_ROOT_PASSWORD != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ env.SERVER_ROOT_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: false
          script: |
            pm2 delete SLAYBOT 2>/dev/null || true
            pkill -f "[n]ode /root/SLAYBOT/bot.js" 2>/dev/null || true
            pm2 save --force 2>/dev/null || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BOT_TOKEN: ${{ env.BOT_TOKEN }}
          MONGO_CONNECTION: ${{ env.MONGO_CONNECTION }}
          ERROR_LOGS: ${{ env.ERROR_LOGS }}
          JOIN_LEAVE_LOGS: ${{ env.JOIN_LEAVE_LOGS }}
          BOT_SECRET: ${{ env.BOT_SECRET }}
          SESSION_PASSWORD: ${{ env.SESSION_PASSWORD }}
          WEATHERSTACK_KEY: ${{ env.WEATHERSTACK_KEY }}
          STRANGE_API_KEY: ${{ env.STRANGE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ env.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ env.SPOTIFY_CLIENT_SECRET }}
          LAVALINK_LOCAL_PASSWORD: ${{ env.LAVALINK_LOCAL_PASSWORD }}
          IMAGE_SPAM_E2E_IMAGE: ${{ env.IMAGE_SPAM_E2E_IMAGE }}
          SMART_INVITES_ENABLED: ${{ env.SMART_INVITES_ENABLED }}
          SMART_INVITES_BASE_URL: ${{ env.SMART_INVITES_BASE_URL }}
          SMART_INVITES_OFFICIAL_GUILD_ID: ${{ env.SMART_INVITES_OFFICIAL_GUILD_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: BOT_TOKEN,MONGO_CONNECTION,ERROR_LOGS,JOIN_LEAVE_LOGS,BOT_SECRET,SESSION_PASSWORD,WEATHERSTACK_KEY,STRANGE_API_KEY,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET,LAVALINK_LOCAL_PASSWORD,IMAGE_SPAM_E2E_IMAGE,SMART_INVITES_ENABLED,SMART_INVITES_BASE_URL,SMART_INVITES_OFFICIAL_GUILD_ID
          script: |
            set -e

            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/opt/slaybot' }}"
            cd "$DEPLOY_DIR"

            TS="$(date +%Y%m%d-%H%M%S)"

            # Backup server-local files before deploy
            if [ -f config.js ]; then cp config.js "config.js.bak.$TS"; fi
            if [ -f .env ]; then cp .env ".env.bak.$TS"; fi

            # Sync latest code (config.js and .env are untracked, git does not touch them)
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f config.js ]; then
              echo "Missing server config.js. Copy example.config.js to config.js and configure it on the server."
              exit 1
            fi

            # Update server .env from GitHub secrets.
            # Skipped when the BOT_TOKEN secret is empty so an existing server .env is never wiped.
            if [ -n "$BOT_TOKEN" ]; then
              node -e 'const fs=require("fs"); const keys=["BOT_TOKEN","MONGO_CONNECTION","ERROR_LOGS","JOIN_LEAVE_LOGS","BOT_SECRET","SESSION_PASSWORD","WEATHERSTACK_KEY","STRANGE_API_KEY","SPOTIFY_CLIENT_ID","SPOTIFY_CLIENT_SECRET","LAVALINK_LOCAL_PASSWORD","SMART_INVITES_ENABLED","SMART_INVITES_BASE_URL","SMART_INVITES_OFFICIAL_GUILD_ID"]; fs.writeFileSync(".env", keys.map((key)=>`${key}=${process.env[key]||""}`).join("\n")+"\n", {mode:0o600});'
            else
              echo "BOT_TOKEN secret is empty; keeping existing server .env"
            fi

            if [ ! -f .env ]; then
              echo "Missing server .env. Set the BOT_TOKEN secret or create .env on the server (see .env.example)."
              exit 1
            fi

            # Keep only the 5 most recent backups of each file
            ls -t config.js.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f --
            ls -t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f --

            # ONNX Runtime downloads its native binary from a separate CDN,
            # which occasionally times out. Retry the clean install without
            # allowing a partial node_modules tree to reach the running bot.
            installed=false
            for attempt in 1 2 3 4; do
              if npm ci --omit=dev; then
                installed=true
                break
              fi
              echo "Dependency install attempt $attempt failed"
              sleep 10
            done
            if [ "$installed" != true ]; then
              echo "Dependency installation failed after 4 attempts"
              exit 1
            fi

            # Warm the local image-spam model cache without blocking a deploy. The
            # classifier also loads it lazily when image spam detection is used.
            if ! npm run image-spam:model:download; then
              echo "::warning::Image-spam model warm-up failed; it will retry when image spam detection is first used."
            fi

            # Optional end-to-end check using an ephemeral encrypted Actions secret.
            if [ -n "$IMAGE_SPAM_E2E_IMAGE" ]; then npm run image-spam:e2e; fi

            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n env PM2_HOME=/root/.pm2 pm2 delete SLAYBOT 2>/dev/null || true
              sudo -n pkill -f "[n]ode /root/SLAYBOT/bot.js" 2>/dev/null || true
              sudo -n env PM2_HOME=/root/.pm2 pm2 save --force 2>/dev/null || true
            fi

            # Restart bot
            pm2 reload slaybot --update-env 2>/dev/null || pm2 start bot.js --name slaybot

            pm2 describe slaybot | grep -F "$DEPLOY_DIR/bot.js"
            pm2 save --force

            # Show status
            pm2 status

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/opt/slaybot' }}"
            sleep 10
            pm2 describe slaybot | grep -F "$DEPLOY_DIR/bot.js"
            pm2 describe slaybot | grep -E "status.*online"
            health="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8081/health)"
            printf '%s\n' "$health" | grep -F '"service":"slaybot-smart-invites"'
            printf '%s\n' "$health" | grep -F '"status":"ok"'
            echo "slaybot is online from $DEPLOY_DIR/bot.js"
            echo "Smart Invites backend is healthy on 127.0.0.1:8081"
